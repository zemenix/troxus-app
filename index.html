<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Troxus Platform - Supabase DB</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #090d16;
            --card: #131b2e;
            --accent: #0098ea;
            --text: #ffffff;
            --subtext: #8292aa;
            --border: #1e293b;
            --green: #10b981;
            --red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }

        .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
        .user-box { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .admin-badge { font-size: 0.7rem; background: var(--red); color: white; padding: 2px 6px; border-radius: 4px; display: none; }

        .view { display: none; padding: 16px; flex-direction: column; gap: 14px; }
        .view.active { display: flex; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .balance-card { background: linear-gradient(135deg, #0098ea, #0052d4); color: white; text-align: center; padding: 20px; border-radius: 16px; }
        .balance-amount { font-size: 2.2rem; font-weight: 800; margin: 6px 0; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-val { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-top: 4px; }

        label { font-size: 0.8rem; color: var(--subtext); margin-bottom: 4px; display: block; }
        input, select { width: 100%; padding: 12px; background: #0b111e; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; margin-bottom: 10px; outline: none; }
        button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; color: var(--subtext); cursor: pointer; background: none; border: none; width: auto; padding: 4px; }
        .nav-item.active { color: var(--accent); font-weight: bold; }
        
        .status-sync { font-size: 0.75rem; color: var(--green); text-align: center; }
    </style>
</head>
<body>

    <!-- App Header -->
    <div class="header">
        <div class="user-box">
            <div class="avatar" id="u-avatar">U</div>
            <div>
                <div style="font-weight: bold; font-size: 0.95rem;" id="u-name">Syncing with Cloud...</div>
                <div style="font-size: 0.75rem; color: var(--subtext);" id="u-id">ID: ---</div>
            </div>
        </div>
        <span class="admin-badge" id="admin-indicator">ADMIN</span>
    </div>

    <!-- VIEW 1: DASHBOARD -->
    <div id="view-dashboard" class="view active">
        <div class="balance-card">
            <div style="font-size: 0.85rem; opacity: 0.9;">Supabase Main Balance</div>
            <div class="balance-amount">$<span id="val-balance">0.00</span></div>
            <div class="status-sync" id="sync-status">☁️ Cloud Synced</div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div style="font-size: 0.8rem; color: var(--subtext);">Staked Tokens</div>
                <div class="stat-val">$<span id="val-staked">0.00</span></div>
            </div>
            <div class="card">
                <div style="font-size: 0.8rem; color: var(--subtext);">Referrals</div>
                <div class="stat-val"><span id="val-ref">0</span> Active</div>
            </div>
        </div>

        <div class="card">
            <h4 style="margin-bottom: 10px;">💸 Fast Transfer</h4>
            <label>Amount ($)</label>
            <input type="number" id="tx-amount" placeholder="0.00">
            <button id="btn-transfer" onclick="executeTransfer()">Send Funds</button>
        </div>
    </div>

    <!-- VIEW 2: STAKING -->
    <div id="view-staking" class="view">
        <div class="card">
            <h3>📈 Fixed Staking Vault</h3>
            <label style="margin-top: 10px;">Amount to Stake ($)</label>
            <input type="number" id="stake-amount" placeholder="0.00">
            <button id="btn-stake" onclick="executeStake()">Stake Tokens</button>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('dashboard', this)">🏠<span>Dashboard</span></button>
        <button class="nav-item" onclick="switchTab('staking', this)">📈<span>Staking</span></button>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. SUPABASE CONFIGURATION (CONFIGURED FOR YOUR PROJECT)
        // -------------------------------------------------------------
        const SUPABASE_URL = "https://kquqnxxkeagetpurvdqg.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_niFQUDkBDZj2fVZltQuzZQ_WuLhRcvu";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Telegram Integration
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        const user = tg?.initDataUnsafe?.user || { id: 8472036561, first_name: "Ayalew", last_name: "Abebe" };
        let currentUserProfile = null;

        document.getElementById('u-name').innerText = `${user.first_name} ${user.last_name || ''}`;
        document.getElementById('u-id').innerText = `ID: ${user.id}`;
        document.getElementById('u-avatar').innerText = user.first_name.charAt(0).toUpperCase();

        // -------------------------------------------------------------
        // 2. SUPABASE DB LOGIC (Fetch or Create User Record)
        // -------------------------------------------------------------
        async function loadUserProfile() {
            document.getElementById('sync-status').innerText = '⏳ Syncing with cloud...';
            
            // Try fetching user record from Supabase
            let { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('telegram_id', user.id)
                .single();

            // If user does not exist yet, create a new row in Supabase
            if (error || !data) {
                const { data: newUser, error: createError } = await supabase
                    .from('profiles')
                    .insert([{ 
                        telegram_id: user.id, 
                        first_name: user.first_name, 
                        last_name: user.last_name || '', 
                        balance: 250.00, 
                        staked: 0.00, 
                        referrals: 0 
                    }])
                    .select()
                    .single();

                if (createError) {
                    alert('Supabase connection error: Check table setup.');
                    return;
                }
                data = newUser;
            }

            currentUserProfile = data;
            renderUI();
            document.getElementById('sync-status').innerText = '☁️ Cloud Synced';
        }

        function renderUI() {
            if (!currentUserProfile) return;
            document.getElementById('val-balance').innerText = parseFloat(currentUserProfile.balance).toFixed(2);
            document.getElementById('val-staked').innerText = parseFloat(currentUserProfile.staked).toFixed(2);
            document.getElementById('val-ref').innerText = currentUserProfile.referrals;
        }

        // -------------------------------------------------------------
        // 3. MUTATIONS (Update Supabase Database)
        // -------------------------------------------------------------
        async function executeTransfer() {
            const amount = parseFloat(document.getElementById('tx-amount').value);
            if (isNaN(amount) || amount <= 0) return alert('Enter a valid amount.');
            if (amount > currentUserProfile.balance) return alert('Insufficient balance.');

            const newBalance = currentUserProfile.balance - amount;

            document.getElementById('btn-transfer').disabled = true;

            const { error } = await supabase
                .from('profiles')
                .update({ balance: newBalance })
                .eq('telegram_id', user.id);

            document.getElementById('btn-transfer').disabled = false;

            if (error) {
                alert('Transfer failed: ' + error.message);
            } else {
                currentUserProfile.balance = newBalance;
                renderUI();
                document.getElementById('tx-amount').value = '';
                alert(`Transferred $${amount.toFixed(2)} successfully!`);
            }
        }

        async function executeStake() {
            const amount = parseFloat(document.getElementById('stake-amount').value);
            if (isNaN(amount) || amount <= 0) return alert('Enter a valid amount.');
            if (amount > currentUserProfile.balance) return alert('Insufficient balance.');

            const newBalance = currentUserProfile.balance - amount;
            const newStaked = currentUserProfile.staked + amount;

            document.getElementById('btn-stake').disabled = true;

            const { error } = await supabase
                .from('profiles')
                .update({ balance: newBalance, staked: newStaked })
                .eq('telegram_id', user.id);

            document.getElementById('btn-stake').disabled = false;

            if (error) {
                alert('Staking failed: ' + error.message);
            } else {
                currentUserProfile.balance = newBalance;
                currentUserProfile.staked = newStaked;
                renderUI();
                document.getElementById('stake-amount').value = '';
                alert(`Staked $${amount.toFixed(2)} successfully!`);
            }
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.add('active');
            el.classList.add('active');
        }

        // Run Cloud Initialization on load
        loadUserProfile();
    </script>
</body>
</html>
